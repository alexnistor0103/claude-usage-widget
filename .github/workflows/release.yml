# Installer builds for handing out: the NSIS .exe from Windows and a universal
# (x86_64 + arm64) .dmg from macOS, via the same scripts a laptop would use.
# Manual trigger only — unsigned artefacts, so nothing publishes itself.
name: release

on:
  workflow_dispatch:
  push:
    tags: ['v*']

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    name: windows installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: release
          workspaces: |
            . -> target
            apps/overlay/src-tauri -> target
      - name: install tauri-cli
        run: cargo install tauri-cli --locked
      - run: powershell -NoProfile -File scripts/build-release.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: apps/overlay/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

  macos:
    name: macos installer (universal)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          key: release
          workspaces: |
            . -> target
            apps/overlay/src-tauri -> target
      - name: install tauri-cli
        run: cargo install tauri-cli --locked
      # Signing and notarization are driven entirely by the Tauri bundler off
      # these env vars; with the secrets unset the build stays unsigned (ad-hoc)
      # and still succeeds, so the pipeline never depends on the Apple account.
      # A secret that is set but unusable (bad base64, wrong password) would
      # fail the bundler's own import, so it is tried here first and dropped.
      - run: |
          if [ -n "$APPLE_CERTIFICATE" ]; then
            kc="$RUNNER_TEMP/check.keychain"; p12="$RUNNER_TEMP/check.p12"
            if ! { printf '%s' "$APPLE_CERTIFICATE" | base64 -d > "$p12" 2>/dev/null \
                && security create-keychain -p check "$kc" \
                && security import "$p12" -k "$kc" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign >/dev/null 2>&1; }; then
              echo "::warning::signing secrets are present but unusable; building unsigned"
              unset APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID
            fi
            security delete-keychain "$kc" 2>/dev/null || true
            rm -f "$p12"
          fi
          sh scripts/build-release.sh --universal
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      - uses: actions/upload-artifact@v4
        with:
          name: macos-installer
          path: apps/overlay/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error
