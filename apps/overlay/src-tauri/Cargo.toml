[package]
name = "cuw-overlay"
version = "0.1.3"
edition = "2021"
license = "PolyForm-Noncommercial-1.0.0"

# Detached from the root workspace: Tauri is M3, kept out of the backend build.
[workspace]

[lib]
name = "cuw_overlay_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon", "image-png"] }
tauri-plugin-window-state = "2"
tauri-plugin-autostart = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# One GET against the GitHub releases API (update.rs). native-tls is the OS
# stack on both targets, so no extra crypto build; nothing else is needed.
reqwest = { version = "0.13", default-features = false, features = ["json", "native-tls"] }
directories = "5"
cuw-tracker = { path = "../../../crates/cuw-tracker" }
