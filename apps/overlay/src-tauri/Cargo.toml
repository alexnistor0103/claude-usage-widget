[package]
name = "cuw-overlay"
version = "0.1.0"
edition = "2021"
license = "MIT"

# Detached from the root workspace: Tauri is M3, kept out of the backend build.
[workspace]

[lib]
name = "cuw_overlay_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon", "image-png"] }
tauri-plugin-window-state = "2"
tauri-plugin-autostart = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
directories = "5"
cuw-tracker = { path = "../../../crates/cuw-tracker" }
