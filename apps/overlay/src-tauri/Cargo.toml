[package]
name = "cuw-overlay"
version = "0.4.2"
edition = "2021"
license = "PolyForm-Noncommercial-1.0.0"

# Detached from the root workspace: Tauri is M3, kept out of the backend build.
[workspace]

[lib]
name = "cuw_overlay_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon", "image-png"] }
tauri-plugin-window-state = "2"
tauri-plugin-autostart = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# One GET against the GitHub releases API (update.rs). native-tls is the OS
# stack on both targets, so no extra crypto build; nothing else is needed.
reqwest = { version = "0.13", default-features = false, features = ["json", "native-tls"] }
# Same OS TLS stack as reqwest above, so one crypto build. `zip` also carries
# the tar/gzip extractor the macOS .app.tar.gz update needs.
tauri-plugin-updater = { version = "2", default-features = false, features = ["native-tls", "zip"] }
directories = "5"
cuw-tracker = { path = "../../../crates/cuw-tracker" }

# The tray's status item (tray.rs): the menu is attached only while presented.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "std",
    "NSButton",
    "NSControl",
    "NSMenu",
    "NSResponder",
    "NSStatusBarButton",
    "NSStatusItem",
    "NSView",
] }
