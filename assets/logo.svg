<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <title>Claude Usage Widget</title>
  <!-- Source of truth for the icon set. Three usage bars filling toward the
       same limit, each a fill inside a full-width track - what the widget
       itself shows. The longest bar is orange because it is the one closest to
       its cap. Raster output is produced by assets/icons.py, which draws the
       same geometry; edit both together. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#201A16"/>
      <stop offset="1" stop-color="#0F0C0A"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#F59E0B" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#F59E0B" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hot" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FB923C"/>
      <stop offset="1" stop-color="#EA580C"/>
    </linearGradient>
    <linearGradient id="warm" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FCD34D"/>
      <stop offset="1" stop-color="#F59E0B"/>
    </linearGradient>
    <clipPath id="squircle">
      <rect x="0" y="0" width="1024" height="1024" rx="189" ry="189"/>
    </clipPath>
  </defs>

  <g clip-path="url(#squircle)">
    <rect width="1024" height="1024" fill="url(#tile)"/>
    <circle cx="512" cy="512" r="512" fill="url(#glow)"/>
  </g>
  <rect x="1" y="1" width="1022" height="1022" rx="188" ry="188"
        fill="none" stroke="#FFFFFF" stroke-opacity="0.09" stroke-width="3"/>

  <g>
    <!-- 5h window, closest to its cap -->
    <rect x="174" y="200" width="676" height="137" rx="68.5" fill="#382E28"/>
    <rect x="174" y="200" width="595" height="137" rx="68.5" fill="url(#hot)"/>
    <!-- 7d window -->
    <rect x="174" y="443" width="676" height="137" rx="68.5" fill="#382E28"/>
    <rect x="174" y="443" width="392" height="137" rx="68.5" fill="url(#warm)"/>
    <!-- a second account, barely started -->
    <rect x="174" y="687" width="676" height="137" rx="68.5" fill="#382E28"/>
    <rect x="174" y="687" width="210" height="137" rx="68.5" fill="url(#warm)"/>
  </g>
</svg>
