[package]
name = "cuw-launch"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
thiserror.workspace = true
tracing.workspace = true

# Same major as cuw-tracker and the overlay's tao/tauri so a release build dedups
# to one copy.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Threading",
] }

# `setsid` in the pre-exec hook, so a terminal that really is our child cannot
# inherit the daemon's controlling terminal.
[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"
