# Type-check-only stand-in for the real crate, whose build.rs compiles
# `try_catch.m` and therefore needs clang plus the macOS SDK. Nothing here is
# ever linked: it exists so `cargo check --target *-apple-darwin` can run on a
# machine that is not a Mac. See scripts/check-macos.ps1.
[package]
name = "objc2-exception-helper"
version = "0.1.1"
edition = "2021"
links = "objc2_exception_helper_0_1"
build = "build.rs"
license = "MIT"

[features]
alloc = []
std = ["alloc"]
